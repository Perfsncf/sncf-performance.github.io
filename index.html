<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Défi Contact — IDFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B2D;
    --ink-2:#1B2A45;
    --ink-line:#2C3E5C;
    --paper:#EEF0EA;
    --paper-2:#E4E7DE;
    --line:#C7C4B4;
    --amber:#F2A72E;
    --amber-dim:#B67A16;
    --teal:#1E6E63;
    --coral:#D65745;
    --ink-text:#101B2D;
    --paper-text:#F4F1E6;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Barlow',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}

  /* ---------- header / board ---------- */
  .board-head{background:var(--ink);color:var(--paper-text);padding:18px 20px 0 20px;}
  .board-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand{font-family:'Barlow Condensed';font-weight:700;font-size:28px;letter-spacing:0.5px;line-height:1;}
  .brand small{display:block;font-family:'IBM Plex Mono';font-weight:500;font-size:11px;color:var(--amber);letter-spacing:1px;margin-top:4px;}
  .board-sub{font-family:'IBM Plex Mono';font-size:11px;color:#93A0B8;text-align:right;line-height:1.5;}
  .tabs{display:flex;gap:10px;margin-top:16px;overflow-x:auto;padding-bottom:14px;}
  .tab{
    display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;
    color:#93A0B8;font-family:'Barlow Condensed';font-weight:600;font-size:15px;padding:6px 4px;
    border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .tab .badge-dot{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed';font-weight:700;font-size:13px;background:var(--ink-line);color:#93A0B8;
  }
  .tab.active{color:var(--paper-text);border-bottom-color:var(--amber);}
  .tab.active .badge-dot{background:var(--amber);color:var(--ink);}
  .tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- content ---------- */
  main{flex:1;padding:22px 20px 100px 20px;}
  h1.page-title{font-family:'Barlow Condensed';font-weight:700;font-size:26px;margin:0 0 4px 0;}
  p.page-lead{color:#4B5567;margin:0 0 20px 0;font-size:15px;line-height:1.5;max-width:52ch;}

  /* split-flap card */
  .flap{
    background:var(--ink);color:var(--paper-text);border-radius:var(--radius);
    padding:18px 18px;position:relative;overflow:hidden;
  }
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35);}
  .flap-eyebrow{font-family:'IBM Plex Mono';font-size:11px;color:var(--amber);letter-spacing:0.5px;margin-bottom:6px;}
  .flap-title{font-family:'Barlow Condensed';font-weight:700;font-size:22px;margin:0 0 8px 0;}
  .flap-body{font-size:14.5px;line-height:1.5;color:#D7DCE8;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;
  }
  .card + .card{margin-top:12px;}

  .stat-row{display:flex;gap:12px;margin-top:14px;}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .stat .num{font-family:'IBM Plex Mono';font-weight:600;font-size:22px;color:var(--ink);}
  .stat .lbl{font-size:12px;color:#6B7488;margin-top:2px;}

  /* home hero + steps */
  .hero-tagline{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1.08;margin:0 0 8px 0;max-width:15ch;}
  .hero-lead{color:#4B5567;font-size:15px;line-height:1.5;margin:0;max-width:46ch;}
  .steps{display:flex;justify-content:space-between;position:relative;margin:22px 0 4px 0;}
  .steps::before{content:"";position:absolute;top:17px;left:17px;right:17px;height:1px;background:var(--line);z-index:0;}
  .step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:31%;gap:8px;}
  .step-ico{width:34px;height:34px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .step-txt{font-size:12.5px;color:#4B5567;line-height:1.35;}
  .section-lbl{font-family:'Barlow Condensed';font-weight:600;font-size:15px;color:var(--ink);margin:26px 0 8px 0;}

  button.primary{
    background:var(--amber);color:var(--ink);border:none;border-radius:var(--radius);
    font-family:'Barlow Condensed';font-weight:700;font-size:17px;padding:13px 20px;cursor:pointer;
    width:100%;margin-top:16px;letter-spacing:0.3px;
  }
  button.primary:hover{background:#E39B1F;}
  button.primary:focus-visible,button.ghost:focus-visible,.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  button.primary:disabled{background:#D9D4C4;color:#8B8676;cursor:not-allowed;}
  button.ghost{
    background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:var(--radius);
    font-family:'Barlow Condensed';font-weight:600;font-size:15px;padding:10px 16px;cursor:pointer;width:100%;margin-top:10px;
  }
  a.textlink{color:#6B7488;font-size:13px;text-decoration:underline;cursor:pointer;}

  .options{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .opt{
    text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius);
    padding:12px 14px;font-family:'Barlow';font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.checkbox .box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;flex-shrink:0;position:relative;}
  .opt.checkbox.selected .box{background:var(--ink);}
  .opt.checkbox.selected .box::after{content:"";position:absolute;left:3px;top:0px;width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(40deg);}
  .opt.selected{border-color:var(--ink);background:var(--paper-2);}
  .opt.correct{border-color:var(--teal);background:#E5F0EC;}
  .opt.incorrect{border-color:var(--coral);background:#FBE9E6;}

  .timer{font-family:'IBM Plex Mono';font-size:13px;color:var(--coral);margin-top:10px;}

  .explain{
    margin-top:14px;padding:12px 14px;border-left:3px solid var(--amber);background:var(--paper-2);
    font-size:14px;line-height:1.5;
  }
  .explain b{display:block;font-family:'Barlow Condensed';font-weight:700;font-size:14px;margin-bottom:2px;}

  .qprog{font-family:'IBM Plex Mono';font-size:12px;color:#6B7488;margin-top:2px;}

  /* leaderboard */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;}
  table.lb{width:100%;border-collapse:collapse;font-size:14px;min-width:600px;}
  table.lb th{text-align:left;font-family:'IBM Plex Mono';font-size:11px;color:#6B7488;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.lb td{padding:10px 8px;border-bottom:1px solid var(--line);}
  table.lb tr.rank1 td:first-child{color:var(--amber-dim);font-weight:700;}
  .rankpos{font-family:'IBM Plex Mono';font-weight:600;}
  .prog-up{color:var(--teal);font-family:'IBM Plex Mono';}
  .prog-down{color:var(--coral);font-family:'IBM Plex Mono';}
  .toggle-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .toggle-row button{
    flex:1 1 auto;min-width:110px;padding:9px;border-radius:var(--radius);border:1px solid var(--ink);background:transparent;
    font-family:'Barlow Condensed';font-weight:600;font-size:14px;cursor:pointer;
  }
  .toggle-row button.on{background:var(--ink);color:var(--paper-text);}

  .headcount-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);}
  .headcount-row:last-child{border-bottom:none;}
  .headcount-row span{font-size:14px;}
  .headcount-row input[type=number]{width:64px;margin-top:0;text-align:center;flex:none;}

  /* badges */
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .badge-tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px;text-align:center;}
  .badge-tile.locked{opacity:0.45;}
  .badge-tile .icon{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--amber);
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px auto;font-family:'Barlow Condensed';font-weight:700;font-size:16px;}
  .badge-tile.locked .icon{background:var(--paper-2);color:#8B8676;}
  .badge-tile .name{font-family:'Barlow Condensed';font-weight:600;font-size:13.5px;}
  .badge-tile .prog{font-family:'IBM Plex Mono';font-size:11px;color:#6B7488;margin-top:3px;}

  /* onboarding */
  .onboard-band{background:var(--ink);color:var(--paper-text);padding:32px 22px 26px 22px;border-bottom:3px solid var(--amber);position:relative;overflow:hidden;}
  .onboard-band::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(242,167,46,0.08);}
  .onboard-band .brand{position:relative;}
  .onboard-band .hero-tagline{color:var(--paper-text);position:relative;}
  .onboard-band .hero-lead{color:#B7C0D4;position:relative;}
  .onboard-band .steps::before{background:var(--ink-line);}
  .onboard-band .step-ico{background:var(--ink-2);border-color:var(--ink-line);color:var(--amber);}
  .onboard-band .step-txt{color:#9FA9C0;}
  .why-line{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--ink-line);
    font-size:12.5px;line-height:1.5;color:#9FA9C0;position:relative;
  }
  .onboard-body{padding:22px 20px 40px 20px;}
  .sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;}
  .sector-card{
    border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px 12px;cursor:pointer;
    display:flex;align-items:center;gap:10px;text-align:left;
  }
  .sector-card:hover{border-color:var(--ink);}
  .sector-card .sbadge{
    width:30px;height:30px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'Barlow Condensed';font-weight:700;font-size:12px;
  }
  .sector-card .sname{font-family:'Barlow Condensed';font-weight:600;font-size:14.5px;line-height:1.2;}
  .sector-card.selected{border-color:var(--ink);background:var(--paper-2);}
  .sector-card.selected .sbadge{background:var(--ink);color:var(--amber);border-color:var(--ink);}
  input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;font-family:'Barlow';font-size:15px;margin-top:8px;
  }
  label{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:#4B5567;display:block;margin-top:16px;}

  footer.gate{text-align:center;padding:18px 0 8px 0;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-text);
    padding:10px 18px;border-radius:var(--radius);font-family:'Barlow Condensed';font-weight:600;font-size:14px;
    border-left:3px solid var(--amber);z-index:50;max-width:90vw;text-align:center;
  }

  /* admin */
  .qedit{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;background:#fff;}
  .qedit textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px;font-family:'Barlow';font-size:14px;margin-top:6px;min-height:44px;}
  .qedit .opt-edit-row{display:flex;gap:6px;margin-top:6px;align-items:center;}
  .qedit .opt-edit-row input[type=text]{margin-top:0;}
  .small{font-size:12px;color:#6B7488;}
  select{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-family:'Barlow';font-size:14.5px;margin-top:8px;background:#fff;}
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}
  .delete-x{background:none;border:none;color:var(--coral);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;}

  /* admin nav */
  .admin-nav{display:flex;gap:6px;margin:16px 0 4px 0;overflow-x:auto;padding-bottom:2px;}
  .admin-pill{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;
    font-family:'Barlow Condensed';font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .admin-pill.on{background:var(--ink);color:var(--paper-text);}
  .admin-pill:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  input[type=number], input[type=date]{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;font-family:'Barlow';font-size:15px;margin-top:8px;
  }
  .scale-row{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .scale-row input[type=number]{margin-top:0;width:64px;flex:none;text-align:center;}
  .mini-lb{width:100%;border-collapse:collapse;margin-top:4px;font-size:14px;}
  .mini-lb td{padding:7px 4px;border-bottom:1px solid var(--line);}
  .mini-lb td:first-child{font-family:'IBM Plex Mono';color:#6B7488;width:22px;}
  .kpi-row{display:flex;gap:12px;margin-top:14px;}
  .quick-actions{display:flex;flex-direction:column;gap:0;margin-top:16px;}
  .total-row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px;}
  .total-row:last-child{border-bottom:none;}
  .total-row b{font-family:'IBM Plex Mono';font-weight:600;}

  .multi-hint{
    display:inline-block;font-family:'Barlow Condensed';font-weight:600;font-size:12.5px;color:var(--amber-dim);
    background:#FBF1DE;border:1px solid #EAD9AE;border-radius:999px;padding:3px 10px;margin-top:8px;
  }
  .preset-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:13px 14px;margin-top:10px;}
  .preset-card .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .preset-card .pname{font-family:'Barlow Condensed';font-weight:700;font-size:15.5px;}
  .preset-card .pbtns{display:flex;gap:6px;flex-shrink:0;}
  .preset-card .pbtn{
    border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 11px;font-family:'Barlow Condensed';
    font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap;
  }
  .preset-card .pbtn.load{background:var(--ink);color:var(--paper-text);}
  .key-item{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-top:10px;}
  .key-item .kq{font-size:14px;font-weight:500;}
  .key-item .ka{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:var(--teal);margin-top:4px;}
  .key-item .ke{font-size:12.5px;color:#6B7488;margin-top:3px;}

  .livret-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:14px;}
  .livret-head{background:var(--ink);color:var(--paper-text);padding:15px 16px;}
  .livret-head .scn{font-family:'Barlow Condensed';font-weight:700;font-size:18px;}
  .livret-head .sit{font-size:13px;color:#B7C0D4;margin-top:5px;font-style:italic;line-height:1.4;}
  .livret-item{padding:12px 16px;border-bottom:1px solid var(--line);}
  .livret-item:last-child{border-bottom:none;}
  .livret-item .itag{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--amber-dim);letter-spacing:0.4px;margin-bottom:4px;}
  .livret-item .itxt{font-size:14px;line-height:1.5;}

  .danger-card{border:1px solid #EFC5BC;background:#FBF1EE;border-radius:var(--radius);padding:14px 16px;margin-top:14px;}
  .danger-card .dtitle{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--coral);margin-bottom:4px;}
  .danger-card .dtxt{font-size:13px;color:#7A4A42;line-height:1.5;margin-bottom:10px;}
  button.danger{
    background:transparent;border:1px solid var(--coral);color:var(--coral);border-radius:var(--radius);
    font-family:'Barlow Condensed';font-weight:700;font-size:14.5px;padding:11px 16px;cursor:pointer;width:100%;margin-top:8px;
  }
  button.danger:hover{background:var(--coral);color:#fff;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,27,43,0.55); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-box{
    background:var(--paper); width:100%; max-width:440px;
    border-radius:var(--radius) var(--radius) 0 0;
    padding:22px 20px 26px 20px; box-shadow:0 -6px 24px rgba(0,0,0,0.25);
  }
  @media (min-width:480px){
    .modal-overlay{ align-items:center; padding:20px; }
    .modal-box{ border-radius:var(--radius); }
  }
  .modal-title{font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:var(--ink);margin-bottom:6px;}
  .modal-msg{font-size:14.5px;color:#4B5567;line-height:1.5;}
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;font-family:'Barlow Condensed';color:#4B5567;">Chargement du Défi Contact…</div></div>

<script>
(function(){

// ---------------------------------------------------------------
// Data / constants
// ---------------------------------------------------------------
const ESTABLISHMENTS = ["Secteur Asnières","Secteur Bécon","Secteur Cergy","Secteur EML Centre / Sud","Secteur EML Nord","Secteur La Défense","Secteur Saint Cloud","Secteur Sartrouville","Secteur Versailles"];
const SECTOR_INITIALS = {
  "Secteur Asnières":"AS", "Secteur Bécon":"BC", "Secteur Cergy":"CY",
  "Secteur EML Centre / Sud":"EC", "Secteur EML Nord":"EN", "Secteur La Défense":"LD",
  "Secteur Saint Cloud":"SC", "Secteur Sartrouville":"SV", "Secteur Versailles":"VS"
};
const THEMES = [
  {key:'accueil', label:'Accueil', letter:'A'},
  {key:'ecoute', label:'Écoute', letter:'É'},
  {key:'prise-en-charge', label:'Prise en charge', letter:'P'},
  {key:'situation-difficile', label:'Situation difficile', letter:'S'},
  {key:'enqueteur', label:'Enquêteur', letter:'E'},
  {key:'boss', label:'Boss IDFM', letter:'B'}
];
// Scénarios officiels évalués sur les résultats ECM IDFM (Livret scénarios ECM Contact voyageurs en gare)
const ECM_SCENARIOS = [
  "Information et orientation",
  "Navigo Easy",
  "Navigo Liberté +",
  "Paiement PV",
  "Perte Navigo mensuel",
  "Renseignement Passe Navigo"
];
const ADMIN_CODE = "pole2026";

// Bibliothèque de 6 défis prêts à l'emploi — un défi = un seul scénario ECM, sans mélange.
// Construits à partir des items officiels du Livret scénarios ECM (Item 11, 12a, 12b, 14).
const PRESET_CHALLENGES = [
  {
    scenario: "Information et orientation", theme: 'accueil',
    title: "Information et orientation",
    intro: "« Bonjour, j'ai besoin de me rendre maintenant à la gare/station X, vous pouvez m'indiquer les horaires, l'itinéraire et la voie/quai ? »",
    questions: [
      { type:'single', bonus:false, timer:null,
        prompt:"Avant de répondre, que fais-tu en premier ? (Item 11 — Reformulation / Questionnement)",
        options:["Je donne directement l'itinéraire le plus rapide","Je pose une question pour m'assurer de sa destination exacte","Je lui demande de patienter pendant que je termine autre chose"],
        correct:1,
        explanation:"Item 11 : on reformule ou on questionne pour confirmer la destination avant de répondre — cela évite de donner un itinéraire erroné." },
      { type:'multi', bonus:false, timer:null,
        prompt:"Un itinéraire complet doit obligatoirement comprendre : (Item 12a)",
        options:["Le trajet de bout en bout, y compris le nom des lignes pour les gares multilignes","Les directions à prendre pour rejoindre la voie","Le tarif exact du billet","Le nombre de voyageurs présents sur le quai"],
        correct:[0,1],
        explanation:"Item 12a exige le trajet complet ET les directions à suivre — le tarif et l'affluence ne sont pas les critères évalués ici." },
      { type:'single', bonus:true, timer:10,
        prompt:"En plus de l'itinéraire, que dois-tu impérativement préciser ? (Item 12b — réponds vite, comme sur le terrain)",
        options:["Les horaires ou la fréquence des trains ET la voie ou le quai de départ","Uniquement le numéro du quai","Rien, l'itinéraire suffit"],
        correct:0,
        explanation:"Item 12b : horaires/fréquence ET voie/quai sont tous deux attendus, pas l'un ou l'autre." },

function resolveScenarioKey(ch){
  if(!ch) return null;
  if(ch.scenario && LIVRET_PAGES[ch.scenario]) return ch.scenario;
  const title = (ch.title || '').trim().toLowerCase();
  const aliases = {
    "information / orientation": "Information et orientation",
    "le voyageur pressé": "Information et orientation",
    "perte du passe navigo mensuel": "Perte Navigo mensuel",
    "paiement du pv": "Paiement PV"
  };
  if(aliases[title]) return aliases[title];
  const keys = Object.keys(LIVRET_PAGES);
  let found = keys.find(k => k.toLowerCase() === title);
  if(found) return found;
  found = keys.find(k => title.includes(k.toLowerCase()) || k.toLowerCase().includes(title));
  return found || null;
}

function participationFor(secteurName, challengeId){
  const data = state.establishmentsData[secteurName];
  const hist = data ? data.history : [];
  const entry = hist.find(h=>h.challengeId===challengeId);
  const plays = entry ? entry.plays : 0;
  const headcount = state.sectorHeadcounts[secteurName];
  const rate = headcount ? Math.round((plays/headcount)*100) : null;
  return {plays, headcount: headcount || null, rate};
}

function instantiateChallenge(preset, week){
  return {
    id: 'w' + week + '-' + Date.now(),
    week: week,
    theme: preset.theme,
    isBoss: false,
    scenario: preset.scenario,
    title: preset.title,
    intro: preset.intro,
    questions: JSON.parse(JSON.stringify(preset.questions)).map((q,i)=>({ id:'q'+(i+1)+'-'+Date.now(), ...q }))
  };
}

function defaultChallenge(week){
  return instantiateChallenge(PRESET_CHALLENGES[0], week);
}

function themeLabel(key){ const t = THEMES.find(t=>t.key===key); return t ? t.label : key; }
function themeLetter(key){ const t = THEMES.find(t=>t.key===key); return t ? t.letter : '?'; }

function renderAnswerKey(challenge){
  const box = document.createElement('div');
  box.style.marginTop = '10px';
  challenge.questions.forEach((q, i)=>{
    const item = document.createElement('div');
    item.className = 'key-item';
    const answerText = q.type === 'multi'
      ? q.correct.map(idx=>q.options[idx]).join(' · ')
      : q.options[q.correct];
    const multiTag = q.type === 'multi' ? ' (plusieurs réponses possibles)' : '';
    item.innerHTML = `
      <div class="kq">${i+1}. ${escapeHtml(q.prompt)}${q.bonus ? ' <span class="small">· bonus</span>' : ''}</div>
      <div class="ka">✅ ${escapeHtml(answerText)}${multiTag}</div>
      <div class="ke">${escapeHtml(q.explanation)}</div>
    `;
    box.appendChild(item);
  });
  return box;
}

function defaultScale(){
  return [
    {id:'g1', min:100, points:100},
    {id:'g2', min:95, points:80},
    {id:'g3', min:90, points:60},
    {id:'g4', min:80, points:40},
    {id:'g5', min:0, points:10}
  ];
}
function computePoints(percent, scale){
  const sorted = [...scale].sort((a,b)=>b.min-a.min);
  for(const row of sorted){ if(percent >= row.min) return row.points; }
  return 0;
}

// Storage helpers
// ---------------------------------------------------------------
async function loadAll(){
  try{
    const p = await window.storage.get('profile', false);
    state.profile = p ? JSON.parse(p.value) : null;
  }catch(e){ state.profile = null; }

  try{
    const c = await window.storage.get('challenges-data', true);
    state.challengesData = c ? JSON.parse(c.value) : null;
  }catch(e){ state.challengesData = null; }

  if(!state.challengesData){
    state.challengesData = { current: defaultChallenge(1), archive: [] };
    try{ await window.storage.set('challenges-data', JSON.stringify(state.challengesData), true); }catch(e){}
  } else {
    const resolved = resolveScenarioKey(state.challengesData.current);
    if(resolved && state.challengesData.current.scenario !== resolved){
      state.challengesData.current.scenario = resolved;
      try{ await window.storage.set('challenges-data', JSON.stringify(state.challengesData), true); }catch(e){}
    }
  }

  try{
    const e = await window.storage.get('establishments-data', true);
    state.establishmentsData = e ? JSON.parse(e.value) : {};
  }catch(err){ state.establishmentsData = {}; }

  try{
    const g = await window.storage.get('grading-scale', true);
    state.gradingScale = g ? JSON.parse(g.value) : null;
  }catch(e){ state.gradingScale = null; }
  if(!state.gradingScale){
    state.gradingScale = defaultScale();
    try{ await window.storage.set('grading-scale', JSON.stringify(state.gradingScale), true); }catch(e){}
  }

  try{
    const s = await window.storage.get('idfm-surveys', true);
    state.idfmSurveys = s ? JSON.parse(s.value) : [];
  }catch(e){ state.idfmSurveys = []; }

  try{
    const hc = await window.storage.get('sector-headcounts', true);
    state.sectorHeadcounts = hc ? JSON.parse(hc.value) : {};
  }catch(e){ state.sectorHeadcounts = {}; }

  state.screen = state.profile ? 'home' : 'onboard';
  render();
}

  try{ await window.storage.set('profile', JSON.stringify(state.profile), false); }
  catch(e){ console.error('save profile failed', e); }

function render(){

  } else {
    const wrap = document.createElement('div');
    wrap.appendChild(renderHeader());
    const main = document.createElement('main');

    if(state.screen === 'home') main.appendChild(renderHome());
    else if(state.screen === 'play') main.appendChild(renderPlay());
    else if(state.screen === 'results') main.appendChild(renderResults());
    else if(state.screen === 'leaderboard') main.appendChild(renderLeaderboard());
    else if(state.screen === 'passport') main.appendChild(renderPassport());

// ---------------------------------------------------------------
// Modal (remplace prompt/confirm/alert natifs, bloqués dans l'iframe du lien publié)
// ---------------------------------------------------------------
function askPrompt(opts){ state.modal = Object.assign({type:'prompt', value:''}, opts); render(); }
function askConfirm(opts){ state.modal = Object.assign({type:'confirm'}, opts); render(); }
function showAlertModal(message){ state.modal = {type:'alert', message}; render(); }

function renderModalOverlay(){
  const m = state.modal;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target === overlay && m.type !== 'prompt'){ state.modal = null; render(); } };

  const box = document.createElement('div');
  box.className = 'modal-box';

  if(m.title){
    const t = document.createElement('div');
    t.className = 'modal-title';
    t.textContent = m.title;
    box.appendChild(t);
  }
  if(m.message){
    const msg = document.createElement('div');
    msg.className = 'modal-msg';
    msg.textContent = m.message;
    box.appendChild(msg);
  }

  if(m.type === 'prompt'){
    const inp = document.createElement('input');
    inp.type = m.inputType || 'text';
    inp.placeholder = m.placeholder || '';
    inp.value = m.value || '';
    inp.style.marginTop = '10px';
    inp.oninput = ()=>{ m.value = inp.value; };
    inp.onkeydown = (e)=>{ if(e.key === 'Enter'){ ok.click(); } };
    box.appendChild(inp);

    const ok = document.createElement('button');
    ok.className = 'primary';
    ok.textContent = m.confirmLabel || 'Valider';
    ok.onclick = ()=>{
      const val = m.value || '';
      state.modal = null;
      if(m.onSubmit) m.onSubmit(val);
      render();
    };
    box.appendChild(ok);

    const cancel = document.createElement('button');
    cancel.className = 'ghost';
    cancel.textContent = 'Annuler';
    cancel.onclick = ()=>{ state.modal = null; render(); };
    box.appendChild(cancel);

    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 30);
  } else if(m.type === 'confirm'){
    const ok = document.createElement('button');
    ok.className = m.danger ? 'danger' : 'primary';
    ok.textContent = m.confirmLabel || 'Confirmer';
    ok.onclick = ()=>{ state.modal = null; if(m.onConfirm) m.onConfirm(); render(); };
    box.appendChild(ok);

    const cancel = document.createElement('button');
    cancel.className = 'ghost';
    cancel.textContent = m.cancelLabel || 'Annuler';
    cancel.onclick = ()=>{ state.modal = null; render(); };
    box.appendChild(cancel);
  } else {
    const ok = document.createElement('button');
    ok.className = 'primary';
    ok.textContent = 'OK';
    ok.onclick = ()=>{ state.modal = null; if(m.onClose) m.onClose(); render(); };
    box.appendChild(ok);
  }

  overlay.appendChild(box);
  return overlay;
}

function renderPlay(){
  const wrap = document.createElement('div');
  const ch = state.challengesData.current;
  const q = ch.questions[state.playIndex];

  if(state.playIndex === 0){
    const introCard = document.createElement('div');
    introCard.className = 'flap';
    introCard.innerHTML = `<div class="flap-eyebrow">LA SITUATION</div><div class="flap-body">${escapeHtml(ch.intro)}</div>`;
    wrap.appendChild(introCard);
  }

  const prog = document.createElement('div');
  prog.className = 'qprog';
  prog.style.marginTop = state.playIndex === 0 ? '14px' : '0';
  prog.textContent = 'Situation ' + (state.playIndex+1) + ' / ' + ch.questions.length;
  wrap.appendChild(prog);

  const h = document.createElement('h1');
  h.className = 'page-title';
  h.style.marginTop = '4px';
  h.textContent = q.bonus ? 'Question bonus' : ch.title;
  wrap.appendChild(h);

  if(q.context){
    const ctx = document.createElement('div');
    ctx.className = 'flap';
    ctx.innerHTML = `<div class="flap-body" style="white-space:pre-line;">${escapeHtml(q.context)}</div>`;
    wrap.appendChild(ctx);
  }

  const card = document.createElement('div');
  card.className = 'card';
  const p = document.createElement('div');
  p.style.fontSize = '16px';
  p.style.fontWeight = '500';
  p.textContent = q.prompt;
  card.appendChild(p);

  if(q.type === 'multi'){
    const hint = document.createElement('div');
    hint.className = 'multi-hint';
    hint.textContent = '☑️ Plusieurs réponses possibles';
    card.appendChild(hint);
  }

  if(q.timer){
    const t = document.createElement('div');
    t.className = 'timer';
    t.textContent = '⏱ ' + q.timer + ' s';
    card.appendChild(t);
    let remaining = q.timer;
    const iv = setInterval(()=>{
      remaining--;
      if(!document.body.contains(t)) { clearInterval(iv); return; }
      t.textContent = '⏱ ' + Math.max(remaining,0) + ' s';
      if(remaining<=0){ clearInterval(iv); if(!state.answers[q.id]) submitAnswer(q, null); }
    },1000);
  }

  const opts = document.createElement('div');
  opts.className = 'options';

  if(q.type === 'single'){
    q.options.forEach((optText, idx)=>{
      const o = document.createElement('div');
      o.className = 'opt';
      o.textContent = optText;
      o.onclick = ()=> submitAnswer(q, idx);
      opts.appendChild(o);
    });
  } else if(q.type === 'multi'){
    const chosen = state.answers['draft-'+q.id] || [];
    q.options.forEach((optText, idx)=>{
      const o = document.createElement('div');
      o.className = 'opt checkbox' + (chosen.includes(idx) ? ' selected':'');
      o.innerHTML = `<span class="box"></span><span>${escapeHtml(optText)}</span>`;
      o.onclick = ()=>{
        const cur = state.answers['draft-'+q.id] || [];
        const i = cur.indexOf(idx);
        if(i>=0) cur.splice(i,1); else cur.push(idx);
        state.answers['draft-'+q.id] = cur;
        render();
      };
      opts.appendChild(o);
    });
  }
  card.appendChild(opts);

  if(q.type === 'multi'){
    const validate = document.createElement('button');
    validate.className = 'primary';
    validate.textContent = 'Valider';
    validate.onclick = ()=> submitAnswer(q, state.answers['draft-'+q.id] || []);
    card.appendChild(validate);
  }

  wrap.appendChild(card);
  return wrap;
}

function submitAnswer(q, selection){
  state.answers[q.id] = selection;
  const ch = state.challengesData.current;
  if(state.playIndex < ch.questions.length - 1){
    state.playIndex++;
    render();
  } else {
    finishChallenge();
  }
}

async function finishChallenge(){
  const ch = state.challengesData.current;
  const alreadyPlayed = state.profile.completedChallengeIds.includes(ch.id);
  let earnedQ = 0, maxQ = 0, points = 0, correctCount = 0;
  const detail = [];

  ch.questions.forEach(q=>{
    const sel = state.answers[q.id];
    if(q.type === 'single'){
      maxQ += 50;
      const isCorrect = sel === q.correct;
      if(isCorrect){ earnedQ += 50; points += 50; correctCount++; }
      if(q.bonus && isCorrect){ points += 25; }
      detail.push({q, sel, isCorrect});
    } else if(q.type === 'multi'){
      const maxPts = q.correct.length * 10;
      maxQ += maxPts;
      const selArr = Array.isArray(sel) ? sel : [];
      const rightHits = selArr.filter(i=>q.correct.includes(i)).length;
      const earned = rightHits * 10;
      earnedQ += earned; points += earned;
      const isCorrect = rightHits === q.correct.length && selArr.length === q.correct.length;
      if(isCorrect){ correctCount++; if(q.bonus) points += 25; }
      detail.push({q, sel:selArr, isCorrect, rightHits});
    }
  });

  const accuracy = maxQ > 0 ? Math.round((earnedQ / maxQ) * 100) : 0;
  let streakBonus = false;

  if(alreadyPlayed){
    // Mode révision : ne compte ni pour les points personnels, ni pour la participation
    // du secteur — évite qu'un agent gonfle les chiffres en rejouant, sans avoir besoin
    // de savoir qui il est (aucune donnée nominative n'entre en jeu).
    points = 0;
  } else {
    points += 25; // défi terminé

    state.profile.completedCount++;
    if(state.profile.completedCount % 3 === 0){ points += 100; streakBonus = true; }

    state.profile.totalPoints += points;
    state.profile.completedChallengeIds.push(ch.id);

    // theme / badge progress
    const tKey = ch.theme;
    if(accuracy >= 60){
      state.profile.themeCounts[tKey] = (state.profile.themeCounts[tKey]||0) + 1;
      const threshold = tKey === 'boss' ? 1 : 3;
      if(state.profile.themeCounts[tKey] >= threshold && !state.profile.badges.includes(tKey)){
        state.profile.badges.push(tKey);
      }
    }

    await saveProfile();

    // établissement : une seule participation comptabilisée par appareil et par défi
    const estName = state.profile.establishment;
    if(!state.establishmentsData[estName]) state.establishmentsData[estName] = {history:[]};
    let entry = state.establishmentsData[estName].history.find(h=>h.challengeId===ch.id);
    if(!entry){
      entry = {challengeId: ch.id, week: ch.week, earned:0, max:0, plays:0};
      state.establishmentsData[estName].history.push(entry);
    }
    entry.earned += earnedQ;
    entry.max += maxQ;
    entry.plays += 1;
    await saveEstablishments();
  }

  state.lastResult = {ch, detail, points, accuracy, streakBonus, alreadyPlayed};
  state.screen = 'results';
  render();
}

function renderLeaderboard(){
  const wrap = document.createElement('div');
  const h = document.createElement('h1');
  h.className = 'page-title';
  h.textContent = 'Classement';
  wrap.appendChild(h);
  const lead = document.createElement('p');
  lead.className = 'page-lead';
  lead.textContent = 'Semaine ' + state.challengesData.current.week + ' — ' + state.challengesData.current.title;
  wrap.appendChild(lead);

  const toggle = document.createElement('div');
  toggle.className = 'toggle-row';
  const b1 = document.createElement('button');
  b1.textContent = '🏆 Meilleur score';
  b1.className = state.lbSort === 'score' ? 'on' : '';
  b1.onclick = ()=>{ state.lbSort='score'; render(); };
  const b2 = document.createElement('button');
  b2.textContent = '🚀 Progression';
  b2.className = state.lbSort === 'progress' ? 'on' : '';
  b2.onclick = ()=>{ state.lbSort='progress'; render(); };
  const b3 = document.createElement('button');
  b3.textContent = '🔍 Enquêtes IDFM';
  b3.className = state.lbSort === 'idfm' ? 'on' : '';
  b3.onclick = ()=>{ state.lbSort='idfm'; render(); };
  const b4 = document.createElement('button');
  b4.textContent = '👥 Participation';
  b4.className = state.lbSort === 'participation' ? 'on' : '';
  b4.onclick = ()=>{ state.lbSort='participation'; render(); };
  toggle.appendChild(b1); toggle.appendChild(b2); toggle.appendChild(b3); toggle.appendChild(b4);
  wrap.appendChild(toggle);

  const curId = state.challengesData.current.id;
  const rows = ESTABLISHMENTS.map(name=>{
    const data = state.establishmentsData[name];
    const hist = data ? data.history : [];
    const cur = hist.find(h=>h.challengeId===curId);
    const avg = cur && cur.max>0 ? Math.round((cur.earned/cur.max)*100) : null;
    const idx = hist.findIndex(h=>h.challengeId===curId);
    let progress = null;
    if(idx > 0){
      const prev = hist[idx-1];
      const prevAvg = prev.max>0 ? Math.round((prev.earned/prev.max)*100) : null;
      if(avg!==null && prevAvg!==null) progress = avg - prevAvg;
    }
    const idfmPoints = state.idfmSurveys.filter(s=>s.secteur===name).reduce((a,c)=>a+c.points,0);
    const part = participationFor(name, curId);
    return {name, avg, progress, idfmPoints, part};
  });

  rows.sort((a,b)=>{
    if(state.lbSort === 'progress'){
      const pa = a.progress===null ? -999 : a.progress;
      const pb = b.progress===null ? -999 : b.progress;
      return pb - pa;
    }
    if(state.lbSort === 'idfm'){
      return b.idfmPoints - a.idfmPoints;
    }
    if(state.lbSort === 'participation'){
      const pa = a.part.rate===null ? a.part.plays : a.part.rate;
      const pb = b.part.rate===null ? b.part.plays : b.part.rate;
      return pb - pa;
    }
    const sa = a.avg===null ? -1 : a.avg;
    const sb = b.avg===null ? -1 : b.avg;
    return sb - sa;
  });

  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const table = document.createElement('table');
  table.className = 'lb';
  table.innerHTML = `<thead><tr><th>#</th><th>Secteur</th><th>Score moy.</th><th>Progression</th><th>Enquêtes</th><th>Participation</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach((r, i)=>{
    const tr = document.createElement('tr');
    if(i===0) tr.className = 'rank1';
    const progText = r.progress===null ? '—' : (r.progress>=0 ? '▲ +'+r.progress+' pts' : '▼ '+r.progress+' pts');
    const progClass = r.progress===null ? '' : (r.progress>=0 ? 'prog-up':'prog-down');
    const partText = r.part.headcount ? r.part.plays + '/' + r.part.headcount + ' · ' + r.part.rate + '%' : r.part.plays + ' joueur(s)';
    tr.innerHTML = `
      <td class="rankpos">${i+1}</td>
      <td>${r.name}</td>
      <td>${r.avg===null ? '—' : r.avg+'%'}</td>
      <td class="${progClass}">${progText}</td>
      <td>${r.idfmPoints} pts</td>
      <td>${partText}</td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  wrap.appendChild(scroll);

  if(!Object.keys(state.sectorHeadcounts).length){
    const note = document.createElement('p');
    note.className = 'small';
    note.style.marginTop = '10px';
    note.textContent = "Le taux de participation s'affichera en % une fois les effectifs de chaque secteur renseignés par le pôle d'appui (onglet Tableau de bord).";
    wrap.appendChild(note);
  }

  return wrap;
}

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div style="font-family:'Barlow Condensed';font-weight:700;font-size:17px;">Ajouter un résultat</div>`;

  const secLbl = document.createElement('label'); secLbl.textContent = 'Secteur concerné';
  const secSel = document.createElement('select');
  const optEmpty = document.createElement('option'); optEmpty.value=''; optEmpty.textContent='— Choisir un secteur —';
  secSel.appendChild(optEmpty);
  ESTABLISHMENTS.forEach(name=>{ const o=document.createElement('option'); o.value=name; o.textContent=name; if(sd.secteur===name) o.selected=true; secSel.appendChild(o); });
  secSel.onchange = ()=>{ sd.secteur = secSel.value; };
  card.appendChild(secLbl); card.appendChild(secSel);

  const row = document.createElement('div'); row.className = 'row2';
  const pctWrap = document.createElement('div');
  const pctLbl = document.createElement('label'); pctLbl.textContent = "Résultat de l'enquête (%)";
  const pctInp = document.createElement('input'); pctInp.type='number'; pctInp.min='0'; pctInp.max='100'; pctInp.placeholder='ex : 92'; pctInp.value = sd.percent;
  pctInp.oninput = ()=>{ sd.percent = pctInp.value; render(); };
  pctWrap.appendChild(pctLbl); pctWrap.appendChild(pctInp);
  row.appendChild(pctWrap);

  const dateWrap = document.createElement('div');
  const dateLbl = document.createElement('label'); dateLbl.textContent = 'Date';
  const dateInp = document.createElement('input'); dateInp.type='date'; dateInp.value = sd.date;
  dateInp.oninput = ()=>{ sd.date = dateInp.value; };
  dateWrap.appendChild(dateLbl); dateWrap.appendChild(dateInp);
  row.appendChild(dateWrap);
  card.appendChild(row);

  const themeLbl = document.createElement('label'); themeLbl.textContent = 'Scénario évalué (optionnel)';
  const themeSel = document.createElement('select');
  const oNone = document.createElement('option'); oNone.value=''; oNone.textContent='Non précisé'; themeSel.appendChild(oNone);
  ECM_SCENARIOS.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; if(sd.theme===s) o.selected=true; themeSel.appendChild(o); });
  themeSel.onchange = ()=>{ sd.theme = themeSel.value; };
  card.appendChild(themeLbl); card.appendChild(themeSel);

  const noteLbl = document.createElement('label'); noteLbl.textContent = 'Note (optionnel)';
  const noteInp = document.createElement('textarea'); noteInp.style.width='100%'; noteInp.style.marginTop='8px'; noteInp.style.minHeight='40px';
  noteInp.value = sd.note; noteInp.oninput = ()=>{ sd.note = noteInp.value; };
  card.appendChild(noteLbl); card.appendChild(noteInp);

  const pct = parseFloat(sd.percent);
  const preview = document.createElement('div');
  preview.className = 'explain';
  if(!isNaN(pct) && pct>=0 && pct<=100){
    const pts = computePoints(pct, state.gradingScale);
    preview.innerHTML = `<b>Points attribués</b>Un résultat à ${pct}% rapporte <strong>${pts} points</strong> à ce secteur, selon le barème actuel.`;
  } else {
    preview.innerHTML = `<b>Points attribués</b>Renseigne un pourcentage pour voir les points calculés en direct.`;
  }
  card.appendChild(preview);

  const submit = document.createElement('button');
  submit.className = 'primary';
  submit.textContent = 'Ajouter le résultat';
  submit.onclick = async ()=>{
    const p = parseFloat(sd.percent);
    if(!sd.secteur){ showAlertModal('Choisis un secteur.'); return; }
    if(isNaN(p) || p<0 || p>100){ showAlertModal('Indique un pourcentage entre 0 et 100.'); return; }
    const pts = computePoints(p, state.gradingScale);
    const entry = { id:'sv'+Date.now(), secteur: sd.secteur, percent: p, theme: sd.theme || null, date: sd.date || '', note: sd.note || '', points: pts };
    state.idfmSurveys.push(entry);
    await saveSurveys();
    state.surveyDraft = {secteur: sd.secteur, percent:'', theme:'', date:'', note:''};
    showToast('Résultat ajouté : +' + pts + ' pts pour ' + entry.secteur);
    render();
  };
  card.appendChild(submit);

  wrap.appendChild(card);

  const histLbl = document.createElement('div');
  histLbl.className = 'section-lbl';
  histLbl.textContent = 'Résultats enregistrés (' + state.idfmSurveys.length + ')';
  wrap.appendChild(histLbl);

  if(state.idfmSurveys.length === 0){
    const empty = document.createElement('p'); empty.className = 'small'; empty.textContent = 'Aucun résultat saisi pour le moment.';
    wrap.appendChild(empty);
  } else {
    const list = [...state.idfmSurveys].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.id.localeCompare(a.id));
    list.forEach(entry=>{
      const rowEl = document.createElement('div');
      rowEl.className = 'qedit';
      rowEl.style.display='flex'; rowEl.style.justifyContent='space-between'; rowEl.style.alignItems='center'; rowEl.style.gap='8px';
      rowEl.innerHTML = `
        <div>
          <div style="font-weight:600;">${escapeHtml(entry.secteur)} — ${entry.percent}%</div>
          <div class="small">${entry.theme ? escapeHtml(entry.theme)+' · ' : ''}${entry.date ? entry.date+' · ' : ''}+${entry.points} pts${entry.note ? ' · '+escapeHtml(entry.note) : ''}</div>
        </div>
      `;
      const del = document.createElement('button'); del.className='delete-x'; del.textContent='×';
      del.onclick = async ()=>{
        state.idfmSurveys = state.idfmSurveys.filter(e=>e.id!==entry.id);
        await saveSurveys();
        render();
      };
      rowEl.appendChild(del);
      wrap.appendChild(rowEl);
    });
  }

  const totLbl = document.createElement('div');
  totLbl.className = 'section-lbl';
  totLbl.textContent = 'Total par secteur';
  wrap.appendChild(totLbl);

  const totCard = document.createElement('div');
  totCard.className = 'card';
  ESTABLISHMENTS.forEach(name=>{
    const total = state.idfmSurveys.filter(e=>e.secteur===name).reduce((a,c)=>a+c.points,0);
    const r = document.createElement('div');
    r.className = 'total-row';
    r.innerHTML = `<span>${name}</span><b>${total} pts</b>`;
    totCard.appendChild(r);
  });
  wrap.appendChild(totCard);

  return wrap;
}

function renderAdminScale(){
  const wrap = document.createElement('div');
  const lead = document.createElement('p');
  lead.className = 'page-lead';
  lead.style.marginTop = '4px';
  lead.textContent = "Définis combien de points rapporte un résultat d'enquête IDFM selon son pourcentage. Le seuil le plus élevé atteint détermine les points — par exemple, un résultat à 92% correspond au seuil ≥ 90%.";
  wrap.appendChild(lead);

  if(!state.scaleDraft){
    state.scaleDraft = JSON.parse(JSON.stringify(state.gradingScale)).sort((a,b)=>b.min-a.min);
  }
  const sc = state.scaleDraft;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div style="font-family:'Barlow Condensed';font-weight:700;font-size:17px;">Barème de points</div>`;

  sc.forEach((rowData, i)=>{
    const r = document.createElement('div');
    r.className = 'scale-row';
    const lbl = document.createElement('span'); lbl.className = 'small'; lbl.textContent = 'Seuil ≥';
    r.appendChild(lbl);
    const minInp = document.createElement('input'); minInp.type='number'; minInp.min='0'; minInp.max='100'; minInp.value = rowData.min;
    minInp.oninput = ()=>{ rowData.min = parseFloat(minInp.value)||0; };
    r.appendChild(minInp);
    const pctSign = document.createElement('span'); pctSign.className='small'; pctSign.textContent='% →';
    r.appendChild(pctSign);
    const ptsInp = document.createElement('input'); ptsInp.type='number'; ptsInp.min='0'; ptsInp.value = rowData.points;
    ptsInp.oninput = ()=>{ rowData.points = parseFloat(ptsInp.value)||0; };
    r.appendChild(ptsInp);
    const ptsSign = document.createElement('span'); ptsSign.className='small'; ptsSign.textContent='pts';
    r.appendChild(ptsSign);
    const del = document.createElement('button'); del.className='delete-x'; del.style.marginLeft='auto'; del.textContent='×';
    del.onclick = ()=>{ sc.splice(i,1); render(); };
    r.appendChild(del);
    card.appendChild(r);
  });

  const addRow = document.createElement('button');
  addRow.className = 'ghost';
  addRow.textContent = '+ Ajouter un seuil';
  addRow.onclick = ()=>{ sc.push({id:'g'+Date.now(), min:0, points:0}); render(); };
  card.appendChild(addRow);

  wrap.appendChild(card);

  const save = document.createElement('button');
  save.className = 'primary';
  save.textContent = 'Enregistrer le barème';
  save.onclick = async ()=>{
    state.gradingScale = sc.map(r=>({id:r.id || ('g'+Math.random().toString(36).slice(2)), min:r.min, points:r.points}));
    await saveScale();
    state.scaleDraft = null;
    showToast('Barème mis à jour.');
    render();
  };
  wrap.appendChild(save);

  const note = document.createElement('p');
  note.className = 'small';
  note.style.marginTop = '8px';
  note.textContent = "Ce barème ne s'applique qu'aux nouveaux résultats saisis ; les points déjà attribués ne changent pas rétroactivement.";
  wrap.appendChild(note);

  return wrap;
}

function renderAdminReset(){
  const wrap = document.createElement('div');

  const lead = document.createElement('p');
  lead.className = 'page-lead';
  lead.style.marginTop = '4px';
  lead.textContent = "Pendant la période de test, efface ici les résultats de jeu pour repartir sur une base propre avant le lancement réel. Ces actions sont irréversibles.";
  wrap.appendChild(lead);

  const curWeek = state.challengesData.current.week;
  const curTitle = state.challengesData.current.title;

  const d1 = document.createElement('div');
  d1.className = 'danger-card';
  d1.innerHTML = `<div class="dtitle">Réinitialiser le défi en cours</div><div class="dtxt">Efface les réponses et scores de tous les secteurs pour le défi actif uniquement (semaine ${curWeek} — « ${escapeHtml(curTitle)} »). Le classement de ce défi repart à zéro ; les autres semaines ne sont pas touchées.</div>`;
  const b1 = document.createElement('button');
  b1.className = 'danger';
  b1.textContent = 'Réinitialiser ce défi';
  b1.onclick = ()=>{
    askConfirm({
      message: 'Effacer les résultats de tous les secteurs pour le défi en cours ? Cette action est irréversible.',
      confirmLabel: 'Réinitialiser',
      danger: true,
      onConfirm: async ()=>{
        const curId = state.challengesData.current.id;
        Object.values(state.establishmentsData).forEach(d=>{
          d.history = d.history.filter(h=>h.challengeId !== curId);
        });
        await saveEstablishments();
        showToast('Résultats du défi en cours réinitialisés.');
        render();
      }
    });
  };
  d1.appendChild(b1);
  wrap.appendChild(d1);

  const d2 = document.createElement('div');
  d2.className = 'danger-card';
  d2.innerHTML = `<div class="dtitle">Réinitialiser tout l'historique de jeu</div><div class="dtxt">Efface les scores et participations de tous les secteurs, pour tous les défis passés et en cours. Le défi actif et son contenu restent inchangés.</div>`;
  const b2 = document.createElement('button');
  b2.className = 'danger';
  b2.textContent = 'Réinitialiser tout l\'historique';
  b2.onclick = ()=>{
    askConfirm({
      message: "Effacer tout l'historique de participation, pour tous les secteurs et tous les défis ? Cette action est irréversible.",
      confirmLabel: 'Réinitialiser',
      danger: true,
      onConfirm: async ()=>{
        state.establishmentsData = {};
        await saveEstablishments();
        showToast('Historique de jeu entièrement réinitialisé.');
        render();
      }
    });
  };
  d2.appendChild(b2);
  wrap.appendChild(d2);

  const d3 = document.createElement('div');
  d3.className = 'danger-card';
  d3.innerHTML = `<div class="dtitle">Supprimer tous les résultats d'enquêtes IDFM</div><div class="dtxt">Efface les ${state.idfmSurveys.length} résultat(s) d'enquête saisi(s) dans l'onglet « Enquêtes IDFM ». Le barème de points n'est pas modifié.</div>`;
  const b3 = document.createElement('button');
  b3.className = 'danger';
  b3.textContent = "Supprimer tous les résultats d'enquêtes";
  b3.onclick = ()=>{
    askConfirm({
      message: "Supprimer tous les résultats d'enquêtes IDFM saisis ? Cette action est irréversible.",
      confirmLabel: 'Supprimer',
      danger: true,
      onConfirm: async ()=>{
        state.idfmSurveys = [];
        await saveSurveys();
        showToast('Résultats d\'enquêtes IDFM supprimés.');
        render();
      }
    });
  };
  d3.appendChild(b3);
  wrap.appendChild(d3);

  const info = document.createElement('p');
  info.className = 'small';
  info.style.marginTop = '14px';
  info.textContent = "Les points, badges et défis joués enregistrés sur le téléphone de chaque agent ne sont pas concernés par cette page : chaque agent peut simplement recommencer avec le lien pour repartir de zéro (le profil est propre à son appareil).";
  wrap.appendChild(info);

  return wrap;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

loadAll();
})();
</script>
</body>
</html>
